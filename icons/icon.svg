<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.35" />
  <!-- Scales of Justice -->
  <g fill="url(#goldGrad)" stroke="url(#goldGrad)">
    <!-- Central Pillar -->
    <rect x="246" y="110" width="20" height="260" rx="8" stroke="none" />
    <!-- Finial Orb -->
    <circle cx="256" cy="100" r="18" stroke="none" />
    <!-- Base Pedestal -->
    <polygon points="160,395 352,395 325,370 187,370" stroke="none" />
    <!-- Beam -->
    <path d="M 95 160 Q 256 145 417 160" fill="none" stroke-width="12" stroke-linecap="round" />
    <circle cx="95" cy="160" r="7" stroke="none" />
    <circle cx="417" cy="160" r="7" stroke="none" />
    <!-- Left Strings & Pan -->
    <line x1="95" y1="160" x2="50" y2="250" stroke-width="4" stroke-linecap="round" />
    <line x1="95" y1="160" x2="140" y2="250" stroke-width="4" stroke-linecap="round" />
    <path d="M 45 250 Q 95 300 145 250 Z" stroke-width="2" />
    <!-- Right Strings & Pan -->
    <line x1="417" y1="160" x2="372" y2="250" stroke-width="4" stroke-linecap="round" />
    <line x1="417" y1="160" x2="462" y2="250" stroke-width="4" stroke-linecap="round" />
    <path d="M 367 250 Q 417 300 467 250 Z" stroke-width="2" />
  </g>
</svg>
